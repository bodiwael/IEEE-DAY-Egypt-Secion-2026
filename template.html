<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IEEE Day 2026 · Fayoum</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00adef"><link rel="icon" href="icon-192.png">
<style>
:root{--b:#00adef;--g:#6abf4b;--o:#f58220;--y:#f9a51a;--p:#93308f;--r:#cc1a3e;--n:#0072bc;--t:#12304d;--m:#6b829a;--l:#e3eef9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;color:var(--t);background:linear-gradient(180deg,#e6f5ff,#fff 320px) fixed #fff;padding-bottom:40px}
.bar{height:6px;background:linear-gradient(90deg,var(--b),var(--g),var(--y),var(--o),var(--p),var(--r),var(--b));background-size:200%;animation:s 6s linear infinite}@keyframes s{to{background-position:200%}}
.ban{width:100%;height:84px;object-fit:cover;display:block}.w{max-width:780px;margin:auto;padding:10px}
.card{background:#fff;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 6px 20px #0072bc18;border:1px solid var(--l)}
.top{display:flex;align-items:center;gap:10px;color:#fff;padding:12px 14px;border-radius:20px;font-weight:700;box-shadow:0 8px 20px #0002;transition:background .4s}.top small{font-weight:400;opacity:.92;display:block}.top .i{font-size:30px}.sp{flex:1}
.ic{cursor:pointer;font-size:20px;padding:4px;transition:.2s}.ic:active{transform:scale(.8) rotate(20deg)}
.chip{border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff;background:#0003}
.pills{display:flex;gap:7px;overflow:auto;padding:8px 2px}.pill{border:2px solid var(--l);background:#fff;color:var(--t);border-radius:30px;padding:8px 13px;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer;transition:.2s}.pill.a{color:#fff;border-color:transparent;transform:scale(1.05)}
.tabs{display:flex;gap:6px;margin:6px 0}.tabs button{flex:1;border:0;border-radius:14px;padding:11px;font-weight:700;background:#fff;color:var(--t);cursor:pointer;box-shadow:0 2px 8px #0072bc14;transition:.2s}.tabs .a{background:var(--p);color:#fff;transform:translateY(-2px)}
input,select{width:100%;padding:13px;border-radius:14px;border:2px solid var(--l);font-size:17px;background:#fff;color:var(--t);margin:5px 0;outline:0;transition:.2s}input:focus,select:focus{border-color:var(--b);box-shadow:0 0 0 4px #00adef22}
.idin{font-size:30px;text-align:center;letter-spacing:5px;font-weight:800}
button.m{background:linear-gradient(135deg,var(--b),var(--n));color:#fff;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 4px 10px #0072bc33}button.m:active{transform:scale(.93)}
button.s{background:#fff;color:var(--n);border:2px solid var(--l);box-shadow:none;padding:8px 11px;font-size:13px}
.res{border-radius:22px;padding:16px;color:#fff;margin:10px 0}.an .res{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.85);opacity:0}}
.ok{background:linear-gradient(135deg,#6abf4b,#2fa36b)}.dup{background:linear-gradient(135deg,#f9a51a,#f58220)}.bad{background:linear-gradient(135deg,#e4415f,#cc1a3e)}
.rh{display:flex;gap:10px;align-items:center}.rh .big{font-size:38px}.an .big{animation:bn .6s}@keyframes bn{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}.res h2{margin:0;font-size:21px}.res small{opacity:.95}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.c{background:#fff;color:var(--t);border-radius:12px;padding:6px 10px;font-weight:800}.c small{display:block;color:var(--m);font-weight:600;font-size:10px}.c.sz{font-size:24px;background:#fff8e1;color:#b45f00}.c.bz{font-size:24px;background:#e3f4ff;color:#0072bc}
.info{display:inline-block;background:var(--b);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:13px;cursor:pointer;vertical-align:middle;transition:.2s}.info:active{transform:scale(1.3)}
.row{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--l)}.an .row{animation:up .3s both;animation-delay:calc(var(--i)*14ms)}@keyframes up{from{transform:translateY(8px);opacity:0}}
.row>b{flex:1;font-size:15px}.row small{display:block;color:var(--m);font-weight:500}.av{width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.tag{font-size:12px;border-radius:9px;padding:3px 8px;color:#fff;font-weight:700;background:var(--p);white-space:nowrap}.g{background:var(--g)}.o{background:var(--o)}.rd{background:var(--r)}
.pb{height:10px;border-radius:8px;background:var(--l);overflow:hidden;margin-top:5px}.pb i{display:block;height:100%;border-radius:8px;background:var(--c,var(--b));transition:width .8s cubic-bezier(.2,.9,.3,1)}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.kpi{border-radius:16px;padding:10px;background:#fff;border:2px solid var(--l);border-top:5px solid var(--c);text-align:center}.kpi b{font-size:26px;display:block;color:var(--c)}.kpi span{font-size:22px}.kpi small{color:var(--m)}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--l);text-align:left;padding:7px}td{padding:7px;border-bottom:1px solid var(--l)}.sc{overflow-x:auto}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:9px}.dg div{background:#f4f9ff;border-radius:12px;padding:8px;word-break:break-all}.dg small{display:block;color:var(--m);font-size:11px}
.sheet{position:fixed;inset:0;background:#0b2a4a88;display:flex;align-items:flex-end;z-index:9;animation:fi .2s}@keyframes fi{from{opacity:0}}.sheet>div{background:#fff;width:100%;max-width:780px;margin:auto;border-radius:24px 24px 0 0;padding:16px;max-height:85vh;overflow:auto;animation:su .3s}@keyframes su{from{transform:translateY(60px)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--t);color:#fff;padding:11px 18px;border-radius:30px;z-index:20;animation:up .3s;font-weight:600}
.row a{color:var(--n);font-weight:700;text-decoration:none}.err{background:#fff1f3;border:2px solid var(--r);color:var(--r);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
</style></head><body><div class="bar"></div><img class="ban" src="__BANNER__" alt="IEEE Day"><div id="app" class="w"></div><div id="sh"></div>
<script>
const DATA=__DATA__,SALT="__SALT__",BUILD="__BUILD__",API_DEFAULT="__API__";
let P=[],PM={},T={};
const CAT={AT:'Attendee',FO:'Former Officer',VIP:'VIP',YP:'YP',SAC:'SAC',AMB:'Ambassador',VOL:'Volunteer'};
const ST={bus:['Morning Bus','🚌','#f58220'],gate:['Arrival · no bus','🚪','#00adef'],kit:['Kit','🎒','#93308f'],lunch:['Lunch','🍽️','#4fa832'],mtn:['Bus → Mountain','⛰️','#cc1a3e'],sand:['Bus → Sandboard','🏜️','#e89200'],falls:['Bus → Falls','💦','#0072bc'],back:['Bus → Return','🏁','#00a99d']};
const LEG=['mtn','sand','falls','back'],RS={bus:['bus','kit','lunch',...LEG],reg:['gate','kit','lunch'],kit:['kit','lunch']};
const ROLE={bus:'Bus lead',reg:'Registration',kit:'Packages',joker:'Joker',admin:'Lead'};
const $=s=>document.querySelector(s),J=k=>JSON.parse(localStorage.getItem(k)||'null'),uuid=()=>crypto.randomUUID();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),nz=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let EV=J('ev')||[],S=J('sess'),view='scan',res=null,q='',flt='',D={},V=new Set(),MS=null,SE='',sy=0,HB='';
let API=localStorage.getItem('api')||API_DEFAULT;{const a=new URLSearchParams(location.search).get('api');if(a){localStorage.setItem('api',a);API=a;history.replaceState(null,'',location.pathname)}}
const save=()=>localStorage.setItem('ev',JSON.stringify(EV));
const adm=()=>S.r==='admin'||S.r==='joker';
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function loadP(k){const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA[0])},key,b64(DATA[1]))));
 P=d.P.map(a=>({u:a[0],id:a[1],n:a[2],e:a[3],p:a[4],c:a[5],b:a[6],nid:a[7],t:a[8],ph:a[9]}));PM={};P.forEach(p=>PM[p.u]=p);T=d.T}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
function beep(ok){navigator.vibrate&&navigator.vibrate(ok?60:[80,60,80]);try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=ok?880:220;o.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch{}}
function idx(){D={};V=new Set(EV.filter(e=>e.st==='void').map(e=>e.ref));EV.filter(e=>e.uid&&!V.has(e.id)).sort((a,b)=>a.ts-b.ts).forEach(e=>{(D[e.uid]=D[e.uid]||{})[e.st]??=e})}
const stations=()=>adm()?Object.keys(ST):RS[S.r]||[S.r];
const mine=()=>P.filter(p=>D[p.u]?.bus?.bus===S.bus);
const closed=()=>EV.some(e=>e.st==='report'&&e.bus===S.bus&&!V.has(e.id));
const lead=bus=>{const t=Object.values(T).find(t=>t.r==='bus'&&t.bus===bus);return t?` · lead ${t.n}${t.ph?' '+t.ph:''}`:''};
const tel=n=>n?` · <a href="tel:${esc(n)}" onclick="event.stopPropagation()">📞 ${esc(n)}</a>`:'';
async function post(o){const r=await fetch(API,{method:'POST',body:JSON.stringify(o)}),t=await r.text();try{return JSON.parse(t)}catch{throw new Error('Backend returned a web page, not data. Deploy as Web app, Execute as Me, access = Anyone, URL ending /exec. Check Apps Script > Executions.')}}
const OLDBE='Backend is running an OLD Code.gs. Paste the new Code.gs, then Deploy › Manage deployments › ✏️ › Version: New version › Deploy.',MISBE=b=>`Backend build ${b} ≠ site build ${BUILD}. Deploy site/ and Code.gs from the SAME build.`;
async function ping(){if(!API){HB='';return}try{const j=await (await fetch(API)).json();HB=j.build||'old'}catch{HB='x'}if(!S)render()}
const hbTxt=()=>!API?'⚠️ not set – tap here':HB===''?'checking…':HB==='x'?'❌ unreachable – check URL / access Anyone':HB==='old'?'❌ OLD Code.gs – deploy new version':HB!==BUILD?`❌ build ${HB} ≠ site ${BUILD}`:'✅ connected';
const netErr=x=>/Failed to fetch|Load failed|NetworkError/.test(x.message)?'Cannot reach the backend. Check internet and the URL (ends /exec, access Anyone).':x.message;
async function login(){const sid=nz($('#sid').value),code=nz($('#pin').value);if(!sid||!code)return toast('Enter your Staff ID and code');if(!API)return toast('Backend not set – tap 🔗 Backend below');
 const bt=$('#go');bt.disabled=true;bt.textContent='Signing in…';let j;
 try{j=await post({op:'login',sid,auth:await sha(sid+code)})}catch(x){bt.disabled=false;bt.textContent='Enter 🚀';return toast(netErr(x))}
 bt.disabled=false;bt.textContent='Enter 🚀';
 if(j.error)return toast(j.error==='locked'?'Too many wrong tries – wait 10 minutes':!j.build?OLDBE:j.build!==BUILD?MISBE(j.build):j.error==='auth'?'Wrong Staff ID or code':'Backend error: '+j.error);
 try{await loadP(j.k)}catch{return toast(`Site (${BUILD}) and backend (${j.build}) are from different builds – redeploy both`)}
 const t=T[sid];if(!t)return toast('Staff ID not in this build');
 S={sid,n:t.n,r:t.r,bus:t.bus,pt:t.pt,ph:t.ph,e:t.e,k:j.k,h:await sha(sid+code),st:{bus:'bus',reg:'gate'}[t.r]||'kit'};
 localStorage.setItem('sess',JSON.stringify(S));localStorage.setItem('lastsid',sid);view=adm()?'stats':'scan';flt='';res=null;render();sync()}
function logout(){if(EV.some(e=>!e.s)&&!confirm('Some scans are not synced yet. They stay on this phone and sync after the next sign-in. Sign out?'))return;S=null;localStorage.removeItem('sess');P=[];res=null;render();ping()}
function setSt(k){S.st=k;localStorage.setItem('sess',JSON.stringify(S));flt='';res=null;q='';render()}
function show(k,p,msg,eid){res={k,u:p?.u,msg,eid};beep(k==='ok');render()}
function ask(k,p,msg,act,al){res={k,u:p.u,msg,act,al};beep(0);render()}
const mailEv=(p,b,ref)=>({id:uuid(),st:'mail',uid:p.u,ref,ts:Date.now(),sid:S.sid,by:S.n,bus:b.bus,pt:b.pt,to:[p.n,p.e],tid:p.id,nid:p.nid,t:p.t,lead:[S.n,S.ph||'']});
function board(p){const e={id:uuid(),uid:p.u,st:'bus',ts:Date.now(),sid:S.sid,by:S.n,bus:S.bus,pt:S.pt};EV.push(e,mailEv(p,e,e.id));return e}
function record(p,how){idx();const st=S.st,d=D[p.u]?.[st],b=D[p.u]?.bus,leg=LEG.includes(st);
 if(d)return show('dup',p,`Already registered at ${tm(d.ts)} by ${d.by}`+(st==='bus'?` · Bus ${d.bus}`:''));
 if(st==='bus'){if(S.r!=='bus')return toast('Boarding is done from a bus lead account');if(closed())return toast('Your bus is confirmed and locked')}
 if(leg&&S.bus&&!how){
  if(!b)return ask('dup',p,`Not on any bus yet. Add to Bus ${S.bus} for the rest of the day? (confirmation email is sent)`,'add',`➕ Add to Bus ${S.bus}`);
  if(b.bus!==S.bus)return ask('bad',p,`WRONG BUS – belongs to Bus ${b.bus}${lead(b.bus)}. Send them to their own bus.`,'ov','Allow anyway (logged)')}
 let e;if(st==='bus'||how==='add')e=board(p);
 if(st!=='bus'){e={id:uuid(),uid:p.u,st,ts:Date.now(),sid:S.sid,by:S.n};if(how==='ov')e.ov=b.bus;EV.push(e)}
 save();idx();
 const w=[],B=D[p.u].bus;
 if(st==='bus'&&p.p!==S.pt)w.push(p.p==='No'?'Was not assigned to a bus':'Was assigned to '+p.p);
 if(how==='add'&&closed())w.push('Added after your bus report was sent');
 if(how==='ov')w.push(`Override logged – belongs to Bus ${b.bus}`);
 if(leg&&!S.bus&&!B)w.push('Not on any bus');
 if(!leg&&st!=='bus'&&st!=='gate'&&!B&&!D[p.u].gate)w.push('Not checked in this morning');
 if(S.bus&&!leg&&st!=='bus'&&st!=='gate')if(B?.bus!==S.bus)w.push(B?'Not in your group (Bus '+B.bus+')':'Not in your group');
 show(w.length?'dup':'ok',p,w.join(' · ')||(B&&st!=='bus'?`Bus ${B.bus} ✓ `:'Registered ✓ ')+tm(e.ts)+(st==='bus'||how==='add'?' · ✉ email in 1 min':''),e.id);sync()}
function handle(code){code=String(code).trim();if(!code)return;let m=P.filter(p=>p.u===code.toUpperCase());if(!m.length){const d=code.replace(/\D/g,'');m=P.filter(p=>p.id===d||p.id===d.padStart(3,'0'))}
 if(!m.length){res={k:'bad',msg:'No one has ID '+esc(code)};beep(0);return render()}
 if(m.length>1){beep(0);$('#sh').innerHTML=`<div class="sheet"><div><h2>⚠️ ID ${m[0].id} belongs to ${m.length} people</h2><p>Who is this?</p>${m.map(p=>`<div class="row"><div class="av" style="background:${p.c=='FO'?'#93308f':'#00adef'}">${p.n[0]}</div><b>${esc(p.n)}<small>${CAT[p.c]} ${esc(p.b)}</small></b><button class="m" onclick="cl();record(PM['${p.u}'])">${CAT[p.c]}</button></div>`).join('')}<button class="m s" style="margin-top:10px" onclick="cl()">Cancel</button></div></div>`;return}
 record(m[0])}
const cl=()=>$('#sh').innerHTML='';
function undo(eid){idx();const m=EV.find(e=>e.st==='mail'&&e.ref===eid&&!V.has(e.id));EV.push({id:uuid(),st:'void',ref:eid,ts:Date.now(),sid:S.sid});if(m)EV.push({id:uuid(),st:'void',ref:m.id,ts:Date.now(),sid:S.sid});save();res=null;toast(m?'Undone – email cancelled':'Undone');render();sync()}
function mailer(u){idx();const p=PM[u],b=D[u]?.bus;if(!b||D[u].mail)return;EV.push(mailEv(p,b,b.id));save();toast('✉ Confirmation email queued');render();sync()}
const mailBtn=u=>{const m=D[u]?.mail;if(!m)return`<button class="m s" onclick="mailer('${u}')">✉ Send email</button>`;const s=MS?.st?.[m.id];return s==='sent'?'<span class="tag g">✉ Sent</span>':s==='fail'?'<span class="tag rd">✉ Failed</span>':s==='cancel'?'<span class="tag" style="background:#8aa">✉ Cancelled</span>':'<span class="tag o">✉ Queued</span>'};
function confirmBus(){idx();const l=mine();if(!l.length)return toast('No one is on your bus yet');
 if(!confirm(`Confirm Bus ${S.bus} with ${l.length} attendees?\nThe full report (with National IDs) is emailed and boarding is locked.`))return;
 EV.push({id:uuid(),st:'report',bus:S.bus,pt:S.pt,ts:Date.now(),sid:S.sid,by:S.n,to:S.e?[S.e]:[],rows:l.map(p=>[p.id,p.n,CAT[p.c],p.b,p.nid,p.t,p.ph,tm(D[p.u].bus.ts),D[p.u].mail?'yes':'no'])});save();toast('📨 Report queued');render();sync()}
const det=p=>{const b=D[p.u]?.bus;return`<div class="dg">${[['🎫 Ticket ID',p.id],['🪪 National ID',p.nid||'—'],['👕 T-shirt',p.t||'—'],['🚌 Bus',b?'Bus '+b.bus:'—'],['🏷️ Category',CAT[p.c]],['📞 Phone',p.ph||'—'],['✉️ Email',p.e],['📍 Point',p.p==='No'?'No bus':p.p],['🏫 Branch',p.b||'—']].map(([a,b])=>`<div><small>${a}</small><b>${esc(b)}</b></div>`).join('')}</div>`};
function info(u){idx();const p=PM[u],d=D[u]||{};$('#sh').innerHTML=`<div class="sheet" onclick="if(event.target==this)cl()"><div><h2>${esc(p.n)}</h2>${det(p)}<h3>Timeline</h3>${Object.entries(ST).map(([k,v])=>`<div class="row"><span>${v[1]}</span><b>${v[0]}${k=='bus'&&d.bus?' · '+d.bus.bus:''}</b>${d[k]?`<span class="tag ${d[k].ov?'rd':'g'}">${tm(d[k].ts)} · ${esc(d[k].by)}</span>`:'<span class="tag" style="background:#c5d3e2">—</span>'}</div>`).join('')}<button class="m" style="width:100%;margin-top:10px" onclick="cl()">Close</button></div></div>`}
function resCard(){if(!res)return'';if(!res.u)return`<div class="res bad"><div class="rh"><span class="big">❌</span><h2>${res.msg}</h2></div></div>`;
 const p=PM[res.u],e=res.act?null:D[p.u]?.[S.st],ic={ok:'✅',dup:'⚠️',bad:'🚫'}[res.k],b=D[p.u]?.bus;
 return`<div class="res ${res.k}"><div class="rh"><span class="big">${ic}</span><div><h2>${esc(p.n)} <span class="info" onclick="info('${p.u}')">ⓘ</span></h2><small>${esc(res.msg||'')}</small></div></div>
 <div class="chips"><div class="c bz"><small>BUS</small>🚌 ${b?esc(b.bus):p.p==='No'?'—':esc(p.p)}</div><div class="c sz"><small>T-SHIRT</small>👕 ${esc(p.t||'—')}</div><div class="c"><small>TICKET ID</small>${p.id}</div><div class="c"><small>NATIONAL ID</small>${esc(p.nid||'—')}</div><div class="c"><small>${CAT[p.c].toUpperCase()}</small>${p.p==='No'?'No bus':p.p}</div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${res.act?`<button class="m s" onclick="record(PM['${p.u}'],'${res.act}')">${res.al}</button>`:''}${S.st==='bus'&&b?.bus===S.bus?mailBtn(p.u):''}${e&&(e.sid===S.sid||adm())&&!(S.st==='bus'&&closed())?`<button class="m s" onclick="undo('${e.id}')">↩ Undo</button>`:''}<button class="m s" onclick="res=null;render()">Next ➜</button></div></div>`}
function busCard(){if(S.r!=='bus')return'';const m=mine(),n=m.length;
 if(LEG.includes(S.st)){const k=m.filter(p=>D[p.u]?.[S.st]).length,ms=n-k;return`<div class="card" style="border-left:6px solid ${ST[S.st][2]}"><b>${ST[S.st][1]} Bus ${esc(S.bus)} · ${ST[S.st][0]}</b> <span class="tag ${ms?'rd':'g'}">${ms?`${k}/${n} · ${ms} missing`:`All ${n} aboard ✓`}</span><p style="margin:6px 0;color:var(--m);font-size:13px">Scan everyone before the bus leaves. Only Bus ${esc(S.bus)} passengers are accepted. See 📋 List → Missing to call anyone not here.</p></div>`}
 if(S.st!=='bus')return'';const c=closed();
 return`<div class="card" style="border-left:6px solid var(--o)"><b>🚌 Bus ${esc(S.bus)} · ${esc(S.pt)}</b> <span class="tag ${c?'g':'o'}">${c?'Confirmed & locked':n+' on board'}</span><p style="margin:6px 0;color:var(--m);font-size:13px">Each scan emails the attendee automatically (bus, National ID, T-shirt). When everyone is on board, send the full report.</p>${c?'':`<button class="m" style="width:100%;background:linear-gradient(135deg,#f58220,#cc1a3e)" onclick="confirmBus()">📨 Confirm bus & send full report</button>`}</div>`}
const df=()=>flt||(S.st==='bus'?'exp':LEG.includes(S.st)?'miss':'mine');

 else dl('attendance_full.csv',[['Ticket ID','Name','Email','Category','Branch','National ID','T-shirt','Phone','Point','Bus',...Object.values(ST).map(s=>s[0])],...P.map(p=>[p.id,p.n,p.e,CAT[p.c],p.b,p.nid,p.t,p.ph,p.p,g(p.u,'bus')?.bus||'',...Object.keys(ST).map(s=>g(p.u,s)?tm(g(p.u,s).ts):'')])])}
async function sync(){if(sy||!S)return;if(!API){SE='No backend URL set. Tap 🔗 and paste your Web app URL (ends with /exec).';return render(true)}if(!navigator.onLine)return;sy=1;

 A.innerHTML=`<div class="top" style="background:linear-gradient(135deg,${co},${co}bb)"><span class="i">${ic}</span><div>${nm}<small>${esc(S.n)} · ${S.sid} · ${ROLE[S.r]}${S.bus?' · Bus '+esc(S.bus):''}</small></div><span class="sp"></span><span class="chip" style="background:${navigator.onLine?'#2fa36b':'#cc1a3e'}">${navigator.onLine?'Online':'Offline'}${pend?' · '+pend:''}</span><span class="ic" onclick="sync()">🔄</span><span class="ic" onclick="const a=prompt('Backend URL (ends /exec)',API);if(a!==null){API=a.trim();localStorage.setItem('api',API);sync()}">🔗</span><span class="ic" onclick="logout()">⏏</span></div>
 ${ss.length>1?`<div class="pills">${ss.map(k=>`<div class="pill ${k==S.st?'a':''}" style="${k==S.st?'background:'+ST[k][2]:''}" onclick="setSt('${k}')">${ST[k][1]} ${ST[k][0]}</div>`).join('')}</div>`:''}
